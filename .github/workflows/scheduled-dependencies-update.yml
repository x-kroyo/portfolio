name: 📅 Schedule Dependencies Update
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  RENOVATE_BASE_DIR: ${{ github.workspace }}/.renovate
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

jobs:
  dependency-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm  
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'

      - name: Cache Renovate cache directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: ${{ runner.os }}-renovate-cache-dir
          path: ${{ env.RENOVATE_BASE_DIR }}/cache

      - name: Read Renovate version
        run: echo "RENOVATE_VERSION=$(< .ci/renovate/.renovate-version)" >> $GITHUB_ENV

      - name: Cache NPM cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: renovate-${{ env.RENOVATE_VERSION }}
          path: ${{ env.NPM_CONFIG_CACHE }}

      - name: Run Renovate
        run: npx -y renovate@${{ env.RENOVATE_VERSION }}
        env:
          LOG_LEVEL: debug
          RENOVATE_CONFIG_FILE: ${{ github.workspace }}/.ci/renovate/renovate.json
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_BASE_DIR: ${{ env.RENOVATE_BASE_DIR }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}